interface:
  display_name: "工作台与工具 Setup"
  short_description: "按场景准备工具，主动补齐授权并验证实际访问"
  default_prompt: "使用 $tutti-bug-workflow:bug-setup，按 QA 提 Bug、根因分析或修复与部署场景选择必需工具与条件工具，把技能同步到本机 Multica 的三个 Agent，先完成全部选中工具的安装或复用及可执行检查，安装阶段结束后立即进入授权，无需用户再次催促；检查并主动处理缺失或过期的认证，发起适用登录并提供授权链接或二维码，本人完成后继续复查目标访问，直到选中能力验证通过或明确等待本人/管理员操作。只梳理或明确跳过时遵循指定范围。"
