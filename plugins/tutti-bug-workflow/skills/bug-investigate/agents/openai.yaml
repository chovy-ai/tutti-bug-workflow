interface:
  display_name: "QA 提 Bug"
  short_description: "记 Bug 即走完全程：登记、带全现场（Web/Server/Computer）、填表"
  default_prompt: "使用 $tutti-bug-workflow:bug-investigate 处理这条 QA 上报：在飞书 Bug 管理表登记，固定采集当时的全部现场（Web 页面日志、Network、Console、截图与快照，tutti-server 日志，Computer 日志），原样上传并填写环境与版本、页面链接、问题上下文；不分析根因。一步接一步连续执行，能并行的并行，耗时操作等它完成，只有自己无法解决的卡点才问用户。"
