interface:
  display_name: "QA 提 Bug"
  short_description: "记 Bug 即走完全程：带全现场（Web/Computer 日志与 request id），在 Multica 登记 issue、发出现场附件，交给分析 Agent"
  default_prompt: "使用 $tutti-bug-workflow:bug-investigate 处理这条 QA 上报：固定采集当时的全部现场（Web 页面日志、Computer 日志），把相关请求的 request id 记进排查线索（不查服务端日志、不用 AWS），在 Multica 的 Bug 项目里登记 issue（标题一句话简介、描述只写 Bug 表现），截图、排查线索和全部日志作为附件发在「现场材料」评论里，再把 issue 分配给分析 Agent。"
