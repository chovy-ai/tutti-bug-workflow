interface:
  display_name: "QA 提 Bug"
  short_description: "记 Bug 即走完全程：登记、采集日志、分析到根因、回填飞书"
  default_prompt: "使用 $tutti-bug-workflow:bug-investigate 处理这条 QA 上报或补充，无论用户说的是记个 bug 还是排查，都走完全程：一步接一步连续执行，中途不停下汇报或询问是否继续，耗时操作等它完成。在飞书建单或找回记录，固定采集 Web 与 Computer 日志并上传，按需查询 Server 日志，读两个最新 main 分析到根因，分字段回填飞书。只有自己无法解决的卡点才一次性向 QA 提问并说明获取方式；排查结束后上传本次会话。"
